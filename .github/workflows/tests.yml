name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths: ['src/**', 'dashboard/**', 'config/**', 'tests/**', 'requirements.txt', '.github/workflows/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src python -m pytest -q tests
      - name: Build the dashboard from synthetic data
        run: PYTHONPATH=src python -m admon.dashboard --source fixture --out "$RUNNER_TEMP/site" --path test
