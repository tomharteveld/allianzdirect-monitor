<title>Allianz Direct Search Monitor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=DM+Serif+Display&family=DM+Serif+Text&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: Follo monitor shell. Fixed sidebar with engines, filter bar, then summary before detail per tab. Purple family only. */
:root{
  --bg:#F3F1F8; --surface:#FFFFFF; --surface-2:#F8F6FC; --tint:#F2EEFF; --tint-2:#E4DBFF;
  --deep:#1E0032; --deep-2:#2C0A5C; --brand:#3B0F96; --accent:#784DFF; --accent-soft:#B9A3FF;
  --fg:#140828; --muted:#4B4753; --subtle:#8B8794; --line:#E6E4EC; --on-deep:#FFFFFF; --on-deep-muted:#C9BCF0;
  --heat-0:#F4F2F9; --heat-1:#E4DBFF; --heat-2:#C4B0FF; --heat-3:#9C7DFF; --heat-4:#6A3CF0; --heat-5:#3B0F96;
  --good:#1E8F6B; --bad:#C2410C;
  --shadow:0 8px 32px rgba(20,8,40,.06);
  --font-title:'DM Serif Text',Georgia,serif; --font-num:'DM Serif Display','DM Serif Text',Georgia,serif;
  --font-head:'Archivo','Helvetica Neue',Arial,sans-serif; --font-body:'Inter','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#120020; --surface:#1C0833; --surface-2:#22103D; --tint:#2A1450; --tint-2:#3A1F6B;
  --deep:#2A0A52; --deep-2:#36106A; --brand:#B9A3FF; --accent:#9A78FF; --accent-soft:#6A4CC9;
  --fg:#F4F0FF; --muted:#C4BBD6; --subtle:#8E84A3; --line:#33204F; --on-deep:#FFFFFF; --on-deep-muted:#C9BCF0;
  --heat-0:#241238; --heat-1:#33195C; --heat-2:#4A2A8A; --heat-3:#6A45C2; --heat-4:#8A66F0; --heat-5:#B9A3FF;
  --good:#4FD1A5; --bad:#FB8B5B; --shadow:0 8px 32px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#120020; --surface:#1C0833; --surface-2:#22103D; --tint:#2A1450; --tint-2:#3A1F6B;
  --deep:#2A0A52; --deep-2:#36106A; --brand:#B9A3FF; --accent:#9A78FF; --accent-soft:#6A4CC9;
  --fg:#F4F0FF; --muted:#C4BBD6; --subtle:#8E84A3; --line:#33204F; --on-deep:#FFFFFF; --on-deep-muted:#C9BCF0;
  --heat-0:#241238; --heat-1:#33195C; --heat-2:#4A2A8A; --heat-3:#6A45C2; --heat-4:#8A66F0; --heat-5:#B9A3FF;
  --good:#4FD1A5; --bad:#FB8B5B; --shadow:0 8px 32px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box} [hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
/* Sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);padding:28px 16px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:22px}
.logo img{height:26px;width:auto;display:block}
.logo .dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo .light{display:none}:root:not([data-theme="light"]) .logo .dark{display:block}}
:root[data-theme="dark"] .logo .light{display:none} :root[data-theme="dark"] .logo .dark{display:block}
.client{border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center}
.client .mono{width:34px;height:34px;border-radius:10px;background:var(--deep);color:var(--on-deep);display:grid;place-items:center;font-family:var(--font-head);font-weight:700}
.client b{font-family:var(--font-head);display:block;font-size:14px}
.client small{color:var(--muted);font-size:12px}
.navlabel{font-family:var(--font-head);color:var(--accent);font-size:12px;letter-spacing:.04em;padding-left:12px}
nav.tabs{display:flex;flex-direction:column;gap:4px}
nav.tabs a{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;text-decoration:none;color:var(--fg);font-weight:500}
nav.tabs a svg{width:18px;height:18px;flex:none}
nav.tabs a:hover{background:var(--tint)}
nav.tabs a.on{background:var(--deep);color:var(--on-deep)}
nav.tabs a .soon{margin-left:auto;font-size:10px;font-family:var(--font-head);background:var(--tint);color:var(--brand);padding:2px 7px;border-radius:999px}
nav.tabs a.on .soon{background:rgba(255,255,255,.15);color:var(--on-deep)}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);display:grid;gap:4px;padding-left:12px}
.side .foot b{color:var(--fg);font-family:var(--font-head)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:middle}
/* Main */
main{min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:18px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface-2)}
.crumb{color:var(--muted)} .crumb b{color:var(--brand);font-family:var(--font-head)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--tint);color:var(--brand);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:500;white-space:nowrap}
.wrap{padding-block:28px 64px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px;max-width:1440px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.eyebrow{color:var(--accent);font-family:var(--font-head);font-size:13px;letter-spacing:.02em;margin:0 0 6px}
h1{font-family:var(--font-title);font-weight:400;font-size:clamp(34px,4.4vw,52px);line-height:1.05;margin:0;text-wrap:balance}
h1 .p{color:var(--accent)}
.lede{color:var(--muted);margin:10px 0 0;max-width:62ch}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.filters label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
select,input[type=search]{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:10px 38px 10px 16px;font:inherit;font-weight:600;font-family:var(--font-head);min-width:180px;background-image:linear-gradient(45deg,transparent 50%,var(--accent) 50%),linear-gradient(135deg,var(--accent) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat}
input[type=search]{background-image:none;padding-right:16px;font-family:var(--font-body);font-weight:400;min-width:220px}
.selbar{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:16px 24px;display:flex;gap:28px;flex-wrap:wrap;align-items:center}
.selbar .k{display:flex;gap:6px;align-items:baseline}
.selbar .k b{font-family:var(--font-head);font-size:18px}
.selbar .k span{color:var(--muted);font-size:13px}
.selbar .sep{width:1px;height:24px;background:var(--line)}
/* Hero band */
.band{background:var(--deep);color:var(--on-deep);border-radius:28px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);overflow:hidden}
.band>div{padding:32px 36px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.band>div+div{border-left:1px solid rgba(255,255,255,.12)}
.band .eyebrow{color:var(--on-deep-muted)}
.band h2{font-family:var(--font-title);font-weight:400;font-size:clamp(30px,3.4vw,42px);line-height:1.05;margin:0}
.band h2 .hl{color:var(--accent-soft)}
.band p{margin:0;color:var(--on-deep-muted)}
.band .big{font-family:var(--font-title);font-size:clamp(26px,2.8vw,34px);line-height:1.1;color:var(--on-deep)}
/* Sections */
section h3{font-family:var(--font-head);font-size:21px;font-weight:700;margin:0;text-wrap:balance}
section .sub{color:var(--muted);margin:4px 0 16px;font-size:13.5px}
.grid{display:grid;gap:20px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:22px 24px;min-width:0}
.card h4{font-family:var(--font-head);font-size:17px;margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .cap{color:var(--muted);font-size:12.5px;margin:2px 0 0}
.go{width:34px;height:34px;border-radius:50%;background:var(--tint);color:var(--brand);display:grid;place-items:center;border:0;cursor:pointer;flex:none;text-decoration:none}
.go:hover{background:var(--tint-2)}
.stats{display:grid;grid-template-columns:1fr 1fr;margin-top:18px}
.stats>div{padding-right:14px;display:grid;gap:2px;align-content:start}
.stats>div+div{border-left:1px solid var(--line);padding-left:18px}
.stat-l{font-size:13px;color:var(--fg)}
.num{font-family:var(--font-num);font-size:44px;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.num.sm{font-size:32px}
.of{font-size:12px;color:var(--muted)}
.delta{font-size:12px;font-weight:600;color:var(--accent);font-family:var(--font-head);margin-top:6px}
.empty{color:var(--subtle);font-size:12.5px;margin-top:6px}
.kpi{display:grid;gap:2px}
.kpi .num{font-size:38px}
.bar{height:5px;border-radius:5px;background:var(--heat-0);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.muted-card{background:var(--surface-2);box-shadow:none;border:1px dashed var(--line)}
/* Tables */
.tcard{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.thead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:22px 24px 14px;flex-wrap:wrap}
.thead h4{font-family:var(--font-head);font-size:17px;margin:0}
.thead p{color:var(--muted);font-size:12.5px;margin:2px 0 0;max-width:70ch}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{background:var(--tint);color:var(--brand);font-family:var(--font-head);font-size:12.5px;text-align:left;padding:11px 14px;white-space:nowrap;cursor:pointer;user-select:none;font-weight:700}
th.r,td.r{text-align:right}
td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:var(--surface-2)}
tr.own td{background:var(--tint)!important;font-weight:600}
tr.own td:first-child{box-shadow:inset 3px 0 var(--accent)}
tr.click{cursor:pointer}
.rank{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:8px;font-family:var(--font-head);font-size:12px;color:var(--muted)}
tr.own .rank{background:var(--brand);color:var(--surface)}
.wij{background:var(--brand);color:var(--surface);border-radius:6px;font-size:11px;padding:2px 6px;margin-left:6px;font-family:var(--font-head)}
.meter{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.meter span.t{width:76px;height:5px;border-radius:5px;background:var(--heat-0);overflow:hidden;display:block}
.meter span.t i{display:block;height:100%;background:var(--accent)}
.meter b{min-width:46px;text-align:right}
.trunc{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.tfoot{padding:12px 24px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tfoot button{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0}
/* Heatmap */
.heat td{padding:0;border-top:1px solid var(--surface)}
.heat td.lab{padding:9px 14px;white-space:nowrap;font-weight:500}
.heat td.c{min-width:64px}
.heat td.c button{display:block;width:100%;height:100%;border:0;padding:10px 6px;text-align:center;font-family:var(--font-head);font-weight:600;font-size:12.5px;cursor:pointer;border-left:2px solid var(--surface)}
.heat th{text-align:center;white-space:normal;line-height:1.2;min-width:64px}
.heat th:first-child{text-align:left}
.h0{background:var(--heat-0);color:var(--subtle)} .h1{background:var(--heat-1);color:var(--brand)} .h2{background:var(--heat-2);color:var(--deep)}
.h3{background:var(--heat-3);color:#FFFFFF} .h4{background:var(--heat-4);color:#FFFFFF} .h5{background:var(--heat-5);color:#FFFFFF}
.legend{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:middle;margin-right:4px}
/* Chips */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;font-family:var(--font-head);white-space:nowrap}
.chip.yes{background:var(--brand);color:var(--surface)} .chip.no{background:var(--heat-0);color:var(--subtle)} .chip.soft{background:var(--tint);color:var(--brand)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
/* Feature cards */
.feat{cursor:pointer;text-align:left;border:0;width:100%}
.feat:hover{box-shadow:0 10px 36px rgba(60,20,140,.12)}
.feat .num{font-size:36px;margin-top:10px}
/* Chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--subtle);font-size:11px;font-family:var(--font-body)}
.chart .gl{stroke:var(--line)}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(18,0,32,.55);z-index:50;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(780px,100%);height:100%;overflow-y:auto;padding-block:max(24px,env(safe-area-inset-top,0px)) 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.drawer .x{align-self:flex-end;border:0;background:var(--tint);color:var(--brand);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:600}
.drawer h2{font-family:var(--font-head);font-size:22px;margin:0;text-wrap:balance}
.answer{background:var(--surface);border-radius:20px;padding:22px 24px;box-shadow:var(--shadow);line-height:1.6;max-width:none}
.answer h5{font-family:var(--font-head);font-size:15px;margin:16px 0 6px}
.answer ul{padding-left:20px;margin:6px 0} .answer li{margin:4px 0}
.answer p{margin:8px 0}
.answer mark{background:var(--tint-2);color:var(--fg);padding:0 3px;border-radius:4px;font-weight:600}
.answer sup a{font-size:10px;text-decoration:none;background:var(--tint);border-radius:4px;padding:0 4px;margin-left:2px}
.src{display:grid;gap:8px}
.src a.s{display:grid;gap:2px;background:var(--surface);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--fg);border:1px solid var(--line)}
.src a.s.own{border-color:var(--accent);background:var(--tint)}
.src a.s small{color:var(--muted)}
.src a.s span.d{font-family:var(--font-head);font-weight:600;font-size:12.5px;color:var(--brand)}
.serp{display:grid;gap:6px}
.serp .r{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;background:var(--surface);border-radius:12px;padding:9px 12px;align-items:center}
.serp .r.own{background:var(--tint);outline:1px solid var(--accent)}
.serp .r b{font-family:var(--font-head);color:var(--muted)}
.serp .r small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{background:var(--surface-2);border-radius:16px;padding:14px 16px;color:var(--muted);font-size:13px;border:1px solid var(--line)}
.note b{color:var(--fg)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

#view{display:flex;flex-direction:column;gap:28px}
#view>section{margin:0}
.heat td.lab a{color:var(--fg);text-decoration:none;font-weight:600}
.heat td.lab a:hover{color:var(--accent);text-decoration:underline}
.heat td.r{padding:9px 18px 9px 14px;white-space:nowrap}
.heat th.r{padding-right:18px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;background:var(--surface);border-radius:999px;padding:6px;box-shadow:var(--shadow);align-self:flex-start;max-width:100%;overflow-x:auto}
.subtabs button{border:0;background:none;border-radius:999px;padding:9px 16px;font-family:var(--font-head);font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.subtabs button:hover{color:var(--fg);background:var(--tint)}
.subtabs button.on{background:var(--deep);color:var(--on-deep)}
.seg{display:inline-flex;background:var(--tint);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 14px;font-family:var(--font-head);font-weight:600;font-size:12.5px;color:var(--brand);cursor:pointer}
.seg button.on{background:var(--deep);color:var(--on-deep)}
table.stk td{padding:9px 10px}
table.stk th.sqh{text-align:center;font-size:11.5px;padding:11px 6px;cursor:default}
table.stk td.sqc{text-align:center;width:46px}
.sq{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;font-family:var(--font-head);font-weight:700;font-size:12px}
.sq.on{background:var(--accent);color:#FFFFFF}
.sq.on i{width:6px;height:6px;border-radius:50%;background:#FFFFFF;display:block}
.sq.off{color:var(--subtle);background:var(--surface-2)}
.sq.none{color:var(--subtle);background:transparent}
.ent{border:0;background:var(--tint);border-radius:12px;padding:8px 14px;display:inline-flex;gap:12px;align-items:baseline;cursor:pointer;font-family:var(--font-head);font-weight:700;font-size:13.5px;color:var(--fg)}
.ent span{font-weight:500;font-size:11.5px;color:var(--accent)}
.ent.me{background:var(--deep);color:var(--on-deep)} .ent.me span{color:var(--on-deep-muted)}
.ent:hover{background:var(--tint-2)} .ent.me:hover{background:var(--deep-2)}
.lnk{border:0;background:none;color:var(--accent);font-size:11.5px;cursor:pointer;padding:0;margin-left:4px}
.kw{font-weight:500}
a.plain{color:var(--fg);text-decoration:none;font-weight:400;display:inline-flex;align-items:center;gap:6px;max-width:100%}
a.plain:hover{color:var(--accent)} a.plain .ext{color:var(--accent);flex:none}
a.plain .trunc{max-width:520px}
table.urls tr.own td{font-weight:400}

.mapcard{display:flex;flex-direction:column;gap:16px}
.maphead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.maphead .seg{flex-wrap:wrap}
.mapgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:start}
.mapwrap svg{width:100%;height:auto;display:block;max-height:720px}
.mapwrap .land{fill:var(--tint);stroke:var(--accent-soft);stroke-width:1.2;stroke-linejoin:round}
.mapwrap .nb{fill:var(--surface-2);stroke:var(--line);stroke-width:1}
.mapwrap .cty{fill:var(--subtle);font-size:13px;font-family:var(--font-body);letter-spacing:.06em;text-transform:uppercase}
.mapwrap .cty.sea{font-style:italic;text-transform:none;letter-spacing:.02em}
.mapwrap .city{cursor:pointer;outline:none}
.mapwrap .city circle.m{stroke:var(--surface);stroke-width:2.5}
.mapwrap .city circle.h0{fill:var(--heat-0)} .mapwrap .city circle.h1{fill:var(--heat-1)} .mapwrap .city circle.h2{fill:var(--heat-2)}
.mapwrap .city circle.h3{fill:var(--heat-3)} .mapwrap .city circle.h4{fill:var(--heat-4)} .mapwrap .city circle.h5{fill:var(--heat-5)}
.mapwrap .city text.v{font-family:var(--font-head);font-weight:700;font-size:10.5px;pointer-events:none}
.mapwrap .city text.v.h0,.mapwrap .city text.v.h1{fill:var(--brand)} .mapwrap .city text.v.h2{fill:var(--deep)} .mapwrap .city text.v.h3,.mapwrap .city text.v.h4,.mapwrap .city text.v.h5{fill:#FFFFFF}
.mapwrap .city text.nm{fill:var(--fg);font-size:12.5px;font-weight:600;font-family:var(--font-head);paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round}
.mapwrap .city:hover circle.m,.mapwrap .city:focus-visible circle.m{stroke:var(--accent);stroke-width:3}
.mapwrap .lead{stroke:var(--accent-soft);stroke-width:1.2} .mapwrap .pin{fill:var(--brand)}
